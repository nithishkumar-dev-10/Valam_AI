# nginx config for the static Valam AI SPA (used by frontend/Dockerfile).
# The API lives on a separate origin; this server only serves the built assets.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (mirrors deploy/nginx-valam.conf; TLS/HSTS is added by the
    # production reverse proxy that terminates HTTPS in front of this container).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=(self)" always;

    # Hashed Vite assets are immutable; index.html must never be cached so
    # clients always pick up the latest bundle after a deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: every client-side route resolves to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
