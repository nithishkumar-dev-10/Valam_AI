# Valam AI — nginx site (HTTP stage; certbot adds the 443 block).
# Install:  sudo cp deploy/nginx-valam.conf /etc/nginx/sites-available/valam
#           sudo ln -s /etc/nginx/sites-available/valam /etc/nginx/sites-enabled/valam
#           sudo rm -f /etc/nginx/sites-enabled/default
#           sudo nginx -t && sudo systemctl reload nginx
# Then:     sudo certbot --nginx -d <your-domain>     (auto-adds HTTPS)

server {
    listen 80;
    server_name api.valam.in;          # ← REPLACE with your real domain

    # Voice notes + field photos can be ~15 MB; let them through.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ML inference (Whisper ASR + CNNs) can take ~10-30 s on first runs.
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # Let's Encrypt HTTP-01 challenge (certbot uses this dir).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}